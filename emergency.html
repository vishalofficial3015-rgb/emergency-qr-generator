<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .title {
            color: #fff;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #bbb;
            font-size: 1.3em;
            margin-bottom: 60px;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .emergency-btn {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff1744 0%, #d32f2f 100%);
            border: none;
            cursor: pointer;
            font-size: 2.5em;
            font-weight: 700;
            color: white;
            box-shadow: 0 15px 50px rgba(255, 23, 68, 0.6), 0 0 0 0 rgba(255, 23, 68, 0.7);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            text-decoration: none;
            animation: pulse 2s infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 15px 50px rgba(255, 23, 68, 0.6), 0 0 0 0 rgba(255, 23, 68, 0.7);
            }
            50% {
                box-shadow: 0 15px 50px rgba(255, 23, 68, 0.8), 0 0 0 15px rgba(255, 23, 68, 0);
            }
            100% {
                box-shadow: 0 15px 50px rgba(255, 23, 68, 0.6), 0 0 0 0 rgba(255, 23, 68, 0);
            }
        }

        .emergency-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 60px rgba(255, 23, 68, 0.8), 0 0 0 0 rgba(255, 23, 68, 0.7);
        }

        .emergency-btn:active {
            transform: scale(0.95);
        }

        .button-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .button-emoji {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        .button-label {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .info-text {
            margin-top: 60px;
            color: #999;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .info-text p {
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2em;
                margin-bottom: 15px;
            }

            .subtitle {
                font-size: 1em;
                margin-bottom: 40px;
            }

            .emergency-btn {
                width: 220px;
                height: 220px;
                font-size: 2em;
            }

            .button-emoji {
                font-size: 2.2em;
                margin-bottom: 5px;
            }

            .info-text {
                margin-top: 40px;
                font-size: 0.85em;
            }
        }

        /* Share Button Styles */
        .share-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .share-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .share-btn:active {
            transform: scale(0.95);
        }

        .share-menu {
            position: absolute;
            top: 60px;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-width: 200px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .share-menu.active {
            display: flex;
        }

        .share-option {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: none;
            text-align: left;
            font-size: 0.95em;
            font-family: inherit;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #333;
        }

        .share-option:hover {
            background: #f5f5f5;
            padding-left: 25px;
        }

        .share-option emoji {
            font-size: 1.2em;
        }

    </style>
</head>
<body>
    <div class="share-container">
        <button class="share-btn" onclick="toggleShareMenu()">
            📤
        </button>
        <div class="share-menu" id="shareMenu">
            <button class="share-option" onclick="shareViaURL()">
                <span>📋 Copy Link</span>
            </button>
            <button class="share-option" onclick="shareViaWhatsApp()">
                <span>💬 WhatsApp</span>
            </button>
            <button class="share-option" onclick="shareViaEmail()">
                <span>📧 Email</span>
            </button>
            <button class="share-option" onclick="shareViaFacebook()">
                <span>👍 Facebook</span>
            </button>
            <button class="share-option" onclick="shareViaTwitter()">
                <span>𝕏 Twitter</span>
            </button>
        </div>
    </div>

    <div class="container">
        <h1 class="title">🚨 EMERGENCY</h1>
        <p class="subtitle">Tap the button to access your emergency details</p>

        <a href="index.11.html" class="emergency-btn">
            <div class="button-text">
                <span class="button-emoji">🆘</span>
                <span class="button-label">TAP HERE</span>
            </div>
        </a>

        <div class="info-text">
            <p>Create and share your emergency QR code</p>
            <p>with your medical information and contacts</p>
        </div>
    </div>

    <script>
        function toggleShareMenu() {
            const shareMenu = document.getElementById('shareMenu');
            shareMenu.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const shareContainer = document.querySelector('.share-container');
            if (!shareContainer.contains(event.target)) {
                document.getElementById('shareMenu').classList.remove('active');
            }
        });

        const siteURL = window.location.href;
        const siteTitle = 'Emergency QR Code Generator';
        const siteDescription = 'Create a QR code with your emergency contact details and medical information';

        function shareViaURL() {
            navigator.clipboard.writeText(siteURL);
            alert('Link copied to clipboard! Share it with others.');
            document.getElementById('shareMenu').classList.remove('active');
        }

        function shareViaWhatsApp() {
            const message = `Check out this Emergency QR Code Generator: ${siteURL}`;
            const whatsappURL = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
            document.getElementById('shareMenu').classList.remove('active');
        }

        function shareViaEmail() {
            const subject = encodeURIComponent(siteTitle);
            const body = encodeURIComponent(`${siteDescription}\n\n${siteURL}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
            document.getElementById('shareMenu').classList.remove('active');
        }

        function shareViaFacebook() {
            const facebookURL = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(siteURL)}`;
            window.open(facebookURL, '_blank', 'width=600,height=400');
            document.getElementById('shareMenu').classList.remove('active');
        }

        function shareViaTwitter() {
            const tweetText = encodeURIComponent(`Check out this Emergency QR Code Generator - ${siteTitle}`);
            const twitterURL = `https://twitter.com/intent/tweet?url=${encodeURIComponent(siteURL)}&text=${tweetText}`;
            window.open(twitterURL, '_blank', 'width=600,height=400');
            document.getElementById('shareMenu').classList.remove('active');
        }
    </script>
</body>
</html>
